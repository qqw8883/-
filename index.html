<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-950">

    <!-- 背景光晕装饰 -->
    <div class="pointer-events-none fixed inset-0 overflow-hidden z-0">
        <div class="absolute -top-32 -left-32 w-96 h-96 bg-violet-600/20 rounded-full blur-3xl"></div>
        <div class="absolute top-1/3 -right-32 w-96 h-96 bg-amber-500/15 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-32 left-1/4 w-96 h-96 bg-rose-600/15 rounded-full blur-3xl"></div>
    </div>

    <!-- 动态容器 -->
    <div id="app" class="relative z-10 flex flex-col min-h-screen justify-between">
        <!-- 动态渲染区域由 JS 控制 -->
        <div class="flex items-center justify-center flex-1 p-6">
            <div class="text-center space-y-3">
                <div class="w-12 h-12 border-4 border-amber-400 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="text-sm text-slate-400">正在准备聚会...</p>
            </div>
        </div>
    </div>

    <!-- 同屏游戏核心逻辑 -->
    <script type="module">
        // 本地同屏房间：数据仅保存在当前浏览器标签页，不进行网络传输。
        const STORAGE_KEY = 'undercover-party-room-v1';
        const UID_KEY = 'undercover-party-player-v1';
        function readStorage(key) { try { return sessionStorage.getItem(key); } catch { return null; } }
        function writeStorage(key, value) { try { sessionStorage.setItem(key, value); } catch {} }
        function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        let localRoom = null;
        try { localRoom = JSON.parse(readStorage(STORAGE_KEY)); } catch {}
        if (!localRoom || !Array.isArray(localRoom.players) || !localRoom.settings) localRoom = null;
        let roomListener = null;
        const db = {}; // 与原游戏动作共用一个本地房间适配层。
        const appId = 'undercover-party-local';
        const doc = (...args) => args.at(-1);
        function snapshot() { return {exists: () => !!localRoom, data: () => structuredClone(localRoom)}; }
        function publishRoom() { writeStorage(STORAGE_KEY, JSON.stringify(localRoom)); if (roomListener) roomListener(snapshot()); }
        async function setDoc(ref, value) { localRoom = structuredClone(value); publishRoom(); }
        async function updateDoc(ref, patch) {
            if (!localRoom) return;
            const next = structuredClone(localRoom);
            for (const [key, value] of Object.entries(patch)) {
                const path = key.split('.');
                let target = next;
                for (const part of path.slice(0, -1)) target = target[part];
                target[path.at(-1)] = structuredClone(value);
            }
            if (next.status === 'SPEAKING' && (localRoom.status !== 'SPEAKING' || next.currentSpeakerId !== localRoom.currentSpeakerId || next.round !== localRoom.round)) next.turnStartedAt = Date.now();
            localRoom = next;
            publishRoom();
        }
        function onSnapshot(ref, callback) { roomListener = callback; callback(snapshot()); return () => { roomListener = null; }; }
        let timerTurn = '';
        let timerDeadline = 0;

        let currentUser = null;
        let currentRoomCode = '';
        let roomData = null;
        let unsubscribeRoom = null;
        
        // 本地交互缓存状态
        let nickname = `玩家${Math.floor(100 + Math.random() * 900)}`;
        const AVATARS = ['🦊', '🐼', '🦁', '🐸', '🐙', '🦄', '🐯', '🦉', '🐝', '🦖', '👽', '🤠'];
        let selectedAvatar = AVATARS[Math.floor(Math.random() * AVATARS.length)];
        let activeControlId = null; // 允许同屏切换视角测试
        let isPeekingCard = false;
        let ttsEnabled = true;
        let aiThinking = false;
        let speakerKeyword = '';
        let customThemeInput = '';
        let roomCodeInput = '';
        let errorMsg = '';
        let showRulesModal = false;
        let timeLeft = 30;
        let timerInterval = null;
        let lastSpokenMsg = '';

        // ==========================================
        // 2. 精选聚会词库
        // ==========================================
        const WORD_LIBRARY = {
            daily: {
                name: '🍹 日常与美食',
                pairs: [
                    { c: '牛奶', u: '豆浆', hint: '都是早餐常客，一个动物源，一个植物源' },
                    { c: '火锅', u: '麻辣烫', hint: '都是热气腾腾的快乐，但社交属性差很多' },
                    { c: '保温杯', u: '热水袋', hint: '都能装热水带来温暖，但一个进肚，一个暖手' },
                    { c: '可口可乐', u: '百事可乐', hint: '世纪红蓝大战，肥宅快乐水的两大巨头' },
                    { c: '洗发水', u: '沐浴露', hint: '浴室双雄，泡沫丰富，用错了其实也没大事' },
                    { c: '包子', u: '饺子', hint: '传统面食有馅家族，皮的厚度和形状不同' }
                ]
            },
            party: {
                name: '🎭 聚会搞怪与情感',
                pairs: [
                    { c: '前任', u: '备胎', hint: '感情里最微妙的两种存在，一个在过去，一个在候场' },
                    { c: '暗恋', u: '单恋', hint: '都是一个人的兵荒马乱，区别在于对方知不知道' },
                    { c: '撒娇', u: '卖萌', hint: '让人心软的技能，一个偏语气动作，一个偏表情状态' },
                    { c: '熬夜', u: '失眠', hint: '都是凌晨三点还不睡，一个是主动狂欢，一个是被动折磨' },
                    { c: '直男', u: '暖男', hint: '形容男性的高频词，一个不懂风情，一个中央空调' }
                ]
            },
            pop: {
                name: '🎬 影视与动漫脑洞',
                pairs: [
                    { c: '蜘蛛侠', u: '蝙蝠侠', hint: '美漫超级英雄，一个靠变异吐丝，一个靠钞能力夜巡' },
                    { c: '柯南', u: '福尔摩斯', hint: '走到哪死到哪的推理大师，一个是小学生，一个是英伦绅士' },
                    { c: '孙悟空', u: '猪八戒', hint: '西天取经核心团队，一个武力担当，一个气氛与退堂鼓担当' },
                    { c: '哈利波特', u: '指环王', hint: '西方魔幻史诗巨作，一个拿魔杖骑扫帚，一个送戒指毁魔戒' }
                ]
            }
        };

        // ==========================================
        // 3. Gemini 内置主持
        // ==========================================
        // 此版本使用内置词库与规则主持，不请求外部 AI 服务。
        async function callGeminiAPI() { return null; }

        // ==========================================
        // 4. 语音播报 TTS
        // ==========================================
        function speakText(text) {
            if (!ttsEnabled || !('speechSynthesis' in window) || !text) return;
            try {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 1.08;
                utterance.pitch = 1.05;
                window.speechSynthesis.speak(utterance);
            } catch (e) {
                console.warn('TTS error:', e);
            }
        }

        // ==========================================
        // 5. 鉴权与房间监听绑定
        // ==========================================
        async function initApp() {
            let uid = readStorage(UID_KEY);
            if (!uid) { uid = 'local_' + (globalThis.crypto?.randomUUID?.() || Date.now().toString(36) + Math.random().toString(36).slice(2)); writeStorage(UID_KEY, uid); }
            currentUser = {uid};
            activeControlId = uid;
            if (localRoom && localRoom.hostId === uid) {
                currentRoomCode = localRoom.roomCode;
                listenRoom(currentRoomCode);
            } else render();
        }

        function listenRoom(code) {
            if (!db) return;
            if (unsubscribeRoom) unsubscribeRoom();
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
            unsubscribeRoom = onSnapshot(roomRef, (snapshot) => {
                if (snapshot.exists()) {
                    roomData = snapshot.data();
                    // 检查 AI 裁判语音播报
                    if (roomData.aiReferee?.message && roomData.aiReferee.message !== lastSpokenMsg) {
                        lastSpokenMsg = roomData.aiReferee.message;
                        speakText(roomData.aiReferee.message);
                    }
                    const turn = roomData.status === 'SPEAKING' ? `${roomData.round}:${roomData.currentSpeakerId}:${roomData.turnStartedAt}` : '';
                    if (turn && timerTurn !== turn) {
                        timerTurn = turn;
                        startTimer(roomData.settings?.speakTime || 30, roomData.turnStartedAt);
                    } else if (!turn) {
                        clearInterval(timerInterval); timerInterval = null; timerTurn = '';
                    }
                } else {
                    errorMsg = '房间已解散或不存在';
                    currentRoomCode = '';
                    roomData = null;
                }
                render();
            }, (err) => {
                console.error('Room sync error:', err);
                errorMsg = '网络同步失败';
                render();
            });
        }

        function startTimer(seconds, startedAt = Date.now()) {
            clearInterval(timerInterval);
            timerDeadline = startedAt + seconds * 1000;
            timeLeft = Math.max(0, Math.ceil((timerDeadline - Date.now()) / 1000));
            timerInterval = setInterval(() => {
                timeLeft = Math.max(0, Math.ceil((timerDeadline - Date.now()) / 1000));
                updateTimerDisplay();
                if (timeLeft === 0) { clearInterval(timerInterval); timerInterval = null; }
            }, 250);
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timer-badge');
            if (el) {
                el.textContent = `${timeLeft}s`;
                if (timeLeft <= 8) {
                    el.className = 'px-3 py-1 rounded-full font-mono text-sm font-black flex items-center gap-1.5 bg-rose-500/20 text-rose-400 animate-pulse';
                }
            }
        }

        // ==========================================
        // 6. 核心游戏房间操作动作 (Create / Join / Start / Vote)
        // ==========================================
        window.createRoom = async function() {
            if (!currentUser || !db) return;
            errorMsg = '';
            isPeekingCard = false;
            nickname = document.getElementById('nickname-input')?.value.trim() || nickname;
            if (!nickname) {
                errorMsg = '请输入聚会昵称';
                render();
                return;
            }
            const code = Math.floor(1000 + Math.random() * 9000).toString();
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
            const initialPlayer = {
                id: currentUser.uid,
                name: nickname,
                avatar: selectedAvatar,
                seat: 1,
                role: null,
                word: null,
                isAlive: true,
                isSimulated: false,
                hasReadySeenCard: false,
                notes: []
            };
            const initialRoom = {
                roomCode: code,
                hostId: currentUser.uid,
                status: 'LOBBY',
                round: 1,
                settings: { undercoverCount: 1, hasBlank: false, category: 'daily', speakTime: 30, aiStyle: '幽默毒舌' },
                wordPair: { civilian: '', undercover: '', hint: '', source: '' },
                players: [initialPlayer],
                speakingOrder: [],
                currentSpeakerId: null,
                pkPlayers: [],
                votes: {},
                lastEliminated: null,
                winner: null,
                aiReferee: {
                    message: `欢迎来到 ${code} 号聚会房间！我是本场自动主持。请添加同屏玩家，凑齐 4 人以上就能发牌啦！`,
                    mood: 'welcome',
                    timestamp: Date.now()
                }
            };
            try {
                await setDoc(roomRef, initialRoom);
                currentRoomCode = code;
                activeControlId = currentUser.uid;
                listenRoom(code);
            } catch (e) {
                console.error(e);
                errorMsg = '创建房间失败';
                render();
            }
        };

        window.resumeRoom = function() {
            if (!localRoom) return;
            currentRoomCode = localRoom.roomCode;
            activeControlId = currentUser.uid;
            errorMsg = '';
            listenRoom(currentRoomCode);
        };

        window.addSimulatedPlayer = async function() {
            if (!roomData || roomData.hostId !== currentUser?.uid) return;
            if (roomData.status !== 'LOBBY') return;
            const demoNames = ['阿强', '小美', '卡卡', '老王', '萌萌', '大壮'];
            const seatNum = roomData.players.length + 1;
            if (seatNum > 12) return;
            const usedNames = new Set(roomData.players.map(p => p.name));
            const name = document.getElementById('friend-name-input')?.value.trim().slice(0,10) || demoNames.find(n => !usedNames.has(n)) || `好友${seatNum}号`;
            const newPlayer = {
                id: `sim_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                name,
                avatar: AVATARS[seatNum % AVATARS.length],
                seat: seatNum,
                role: null,
                word: null,
                isAlive: true,
                isSimulated: true,
                hasReadySeenCard: false,
                notes: []
            };
            roomData.players.push(newPlayer);
            if (roomData.players.length >= 7) roomData.settings.undercoverCount = 2;
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomCode);
            await updateDoc(roomRef, {
                players: roomData.players,
                'settings.undercoverCount': roomData.settings.undercoverCount,
                aiReferee: { message: `已添加 ${seatNum} 号【${name}】！在顶部切换玩家，将设备交给对应的人。`, timestamp: Date.now() }
            });
        };

        window.removePlayer = async function(pid) {
            if (!roomData || roomData.hostId !== currentUser?.uid || roomData.status !== 'LOBBY') return;
            roomData.players = roomData.players.filter(p => p.id !== pid).map((p, idx) => ({ ...p, seat: idx + 1 }));
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomCode);
            await updateDoc(roomRef, { players: roomData.players });
        };

        window.updateSetting = async function(key, val) {
            if (!roomData || roomData.hostId !== currentUser?.uid) return;
            roomData.settings[key] = val;
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomCode);
            await updateDoc(roomRef, { [`settings.${key}`]: val });
        };

        window.startGame = async function(useAI = false) {
            if (!roomData || roomData.hostId !== currentUser?.uid || roomData.status !== 'LOBBY' || aiThinking) return;
            errorMsg = '';
            if (roomData.players.length < 4) {
                errorMsg = '至少需要 4 人才能开局';
                render();
                return;
            }
            aiThinking = true;
            render();

            let pair = null;
            let opening = '';
            if (useAI) {
                const schema = {
                    type: "OBJECT",
                    properties: { civilianWord: { type: "STRING" }, undercoverWord: { type: "STRING" }, subtleHint: { type: "STRING" }, openingJoke: { type: "STRING" } },
                    required: ["civilianWord", "undercoverWord", "subtleHint", "openingJoke"]
                };
                const res = await callGeminiAPI(`请为聚会生成一组《谁是卧底》词条。主题：${customThemeInput || '年轻人日常'}`, `你是AI裁判`, schema);
                if (res) {
                    pair = { civilian: res.civilianWord, undercover: res.undercoverWord, hint: res.subtleHint, source: '✨ AI 实时命题' };
                    opening = res.openingJoke;
                }
            }
            if (!pair) {
                const cat = WORD_LIBRARY[roomData.settings.category] || WORD_LIBRARY.daily;
                const item = cat.pairs[Math.floor(Math.random() * cat.pairs.length)];
                const flip = Math.random() > 0.5;
                pair = { civilian: flip ? item.c : item.u, undercover: flip ? item.u : item.c, hint: item.hint, source: cat.name };
                opening = '底牌已准备好！请轮流接过设备，按住查看自己的词，确认后交给下一位。';
            }

            const total = roomData.players.length;
            const bCount = roomData.settings.hasBlank && total >= 5 ? 1 : 0;
            const uCount = Math.max(1, Math.min(roomData.settings.undercoverCount || 1, Math.floor((total - 1) / 2) - bCount));
            const cCount = total - uCount - bCount;
            const pool = [...Array(cCount).fill('CIVILIAN'), ...Array(uCount).fill('UNDERCOVER'), ...Array(bCount).fill('BLANK')];
            
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }

            roomData.players = roomData.players.map((p, idx) => {
                const role = pool[idx];
                let word = pair.civilian;
                if (role === 'UNDERCOVER') word = pair.undercover;
                if (role === 'BLANK') word = '【白板（盲猜词义）】';
                return { ...p, role, word, isAlive: true, hasReadySeenCard: false, notes: [] };
            });

            aiThinking = false;
            isPeekingCard = false;
            activeControlId = currentUser.uid;
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomCode);
            await updateDoc(roomRef, {
                status: 'DEALING',
                round: 1,
                wordPair: pair,
                players: roomData.players,
                aiReferee: { message: opening, timestamp: Date.now() }
            });
        };

        window.confirmSeenCard = async function() {
            if (!roomData || roomData.status !== 'DEALING') return;
            const effId = activeControlId || currentUser?.uid;
            const p = roomData.players.find(pl => pl.id === effId);
            if (!p || p.hasReadySeenCard) return;
            isPeekingCard = false;
            p.hasReadySeenCard = true;
            const allReady = roomData.players.every(pl => pl.hasReadySeenCard);
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomCode);
            if (!allReady) activeControlId = roomData.players.find(pl => !pl.hasReadySeenCard).id;
            if (allReady) {
                await startSpeakingRound(roomData.players, 1, []);
            } else {
                await updateDoc(roomRef, { players: roomData.players });
            }
        };

        async function startSpeakingRound(playersList, roundNum, pkIds = []) {
            const eligible = pkIds.length > 0 ? playersList.filter(p => pkIds.includes(p.id)) : playersList.filter(p => p.isAlive);
            if (eligible.length === 0) return;
            const startIdx = Math.floor(Math.random() * eligible.length);
            const orderedIds = [...eligible.slice(startIdx).map(p => p.id), ...eligible.slice(0, startIdx).map(p => p.id)];
            const firstSpk = playersList.find(p => p.id === orderedIds[0]);
            const isPK = pkIds.length > 0;
            const msg = isPK ? `平票PK！请 ${firstSpk.seat}号【${firstSpk.name}】辩解发言！` : `第 ${roundNum} 轮发言开始！由 ${firstSpk.seat}号【${firstSpk.name}】打头阵！`;
            
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomCode);
            await updateDoc(roomRef, {
                players: playersList,
                status: 'SPEAKING',
                round: roundNum,
                speakingOrder: orderedIds,
                currentSpeakerId: orderedIds[0],
                pkPlayers: pkIds,
                votes: {},
                aiReferee: { message: msg, timestamp: Date.now() }
            });
        }

        window.finishSpeaking = async function() {
            if (!roomData || roomData.status !== 'SPEAKING') return;
            const currentId = roomData.currentSpeakerId;
            const order = roomData.speakingOrder || [];
            const idx = order.indexOf(currentId);
            const kwInput = document.getElementById('speaker-keyword-input');
            if (kwInput && kwInput.value.trim()) {
                speakerKeyword = kwInput.value.trim();
                roomData.players = roomData.players.map(p => {
                    if (p.id === currentId) p.notes = [...(p.notes || []), `R${roomData.round}: ${speakerKeyword}`];
                    return p;
                });
                speakerKeyword = '';
            }
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomCode);
            if (idx >= 0 && idx < order.length - 1) {
                const nextId = order[idx + 1];
                const nextSpk = roomData.players.find(p => p.id === nextId);
                await updateDoc(roomRef, {
                    players: roomData.players,
                    currentSpeakerId: nextId,
                    aiReferee: { message: `接下来请 ${nextSpk.seat}号【${nextSpk.name}】发言！`, timestamp: Date.now() }
                });
            } else {
                await updateDoc(roomRef, {
                    players: roomData.players,
                    status: 'VOTING',
                    currentSpeakerId: null,
                    votes: {},
                    aiReferee: { message: `全员发言完毕！请轮流接过设备秘密投票，投票后切换至下一位。`, timestamp: Date.now() }
                });
            }
        };

        window.castVote = async function(targetId) {
            if (!roomData || roomData.status !== 'VOTING') return;
            const effId = activeControlId || currentUser?.uid;
            const myPl = roomData.players.find(p => p.id === effId);
            if (!myPl || !myPl.isAlive || targetId === myPl.id || roomData.votes?.[myPl.id] !== undefined) return;
            if (targetId !== 'ABSTAIN' && (!roomData.players.some(p => p.id === targetId && p.isAlive) || (roomData.pkPlayers?.length && !roomData.pkPlayers.includes(targetId)))) return;
            roomData.votes = roomData.votes || {};
            roomData.votes[myPl.id] = targetId;
            const alive = roomData.players.filter(p => p.isAlive);
            const allVoted = alive.every(p => roomData.votes[p.id] !== undefined);
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomCode);
            const nextVoter = alive.find(p => roomData.votes[p.id] === undefined);
            if (nextVoter) activeControlId = nextVoter.id;
            if (allVoted) {
                await tallyVotes(roomData.votes);
            } else {
                await updateDoc(roomRef, { votes: roomData.votes });
            }
        };

        async function tallyVotes(votesMap) {
            const counts = {};
            Object.values(votesMap).forEach(tid => {
                if (tid && tid !== 'ABSTAIN') counts[tid] = (counts[tid] || 0) + 1;
            });
            let maxV = 0;
            Object.values(counts).forEach(c => { if (c > maxV) maxV = c; });
            const topIds = Object.keys(counts).filter(id => counts[id] === maxV);
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomCode);

            if (maxV === 0 || topIds.length === 0) {
                await updateDoc(roomRef, {
                    votes: votesMap,
                    status: 'RESULT',
                    lastEliminated: { type: 'NONE', reason: '全员弃票，本轮平安夜无人出局！' },
                    aiReferee: { message: `全员弃票！平安夜无人出局！`, timestamp: Date.now() }
                });
                return;
            }

            if (topIds.length > 1) {
                if (!roomData.pkPlayers || roomData.pkPlayers.length === 0) {
                    await startSpeakingRound(roomData.players, roomData.round, topIds);
                    return;
                } else {
                    await updateDoc(roomRef, {
                        votes: votesMap,
                        status: 'RESULT',
                        pkPlayers: [],
                        lastEliminated: { type: 'TIE_SAFE', reason: `PK平票，本轮平安夜无人出局！` },
                        aiReferee: { message: `PK依然平票，无人出局！`, timestamp: Date.now() }
                    });
                    return;
                }
            }

            const elimId = topIds[0];
            const elimPlayer = roomData.players.find(p => p.id === elimId);
            roomData.players = roomData.players.map(p => p.id === elimId ? { ...p, isAlive: false } : p);

            const aliveList = roomData.players.filter(p => p.isAlive);
            const aliveU = aliveList.filter(p => p.role === 'UNDERCOVER' || p.role === 'BLANK');
            const aliveC = aliveList.filter(p => p.role === 'CIVILIAN');

            let winner = null;
            if (aliveU.length === 0) winner = 'CIVILIAN';
            else if (aliveC.length <= aliveU.length || aliveList.length <= 2) winner = 'UNDERCOVER';

            const roleLbl = elimPlayer.role === 'CIVILIAN' ? '平民' : elimPlayer.role === 'UNDERCOVER' ? '卧底' : '白板';

            if (winner) {
                await updateDoc(roomRef, {
                    players: roomData.players,
                    votes: votesMap,
                    status: 'GAME_OVER',
                    winner,
                    pkPlayers: [],
                    lastEliminated: { type: 'ELIMINATED', player: elimPlayer, votesCount: maxV, roleLabel: roleLbl },
                    aiReferee: { message: `游戏结束！${winner === 'CIVILIAN' ? '平民阵营获胜！' : '卧底阵营逆袭获胜！'}`, timestamp: Date.now() }
                });
            } else {
                await updateDoc(roomRef, {
                    players: roomData.players,
                    votes: votesMap,
                    status: 'RESULT',
                    pkPlayers: [],
                    lastEliminated: { type: 'ELIMINATED', player: elimPlayer, votesCount: maxV, roleLabel: roleLbl },
                    aiReferee: { message: `${elimPlayer.seat}号【${elimPlayer.name}】出局，真实身份是【${roleLbl}】！游戏继续！`, timestamp: Date.now() }
                });
            }
        }

        window.askAICoement = async function() {
            if (!roomData) return;
            const comments = ['先听描述，再看逻辑。说得多不一定就安全！', '别急着跟票，想想每个人的描述能否互相对上。', '描述用途、感觉或场景，但不要直接说出词语。'];
            const message = comments[Math.floor(Math.random() * comments.length)];
            await updateDoc(currentRoomCode, {aiReferee: {message, timestamp: Date.now()}});
        };

        window.backToLobby = async function() {
            if (!roomData || roomData.hostId !== currentUser?.uid) return;
            roomData.players = roomData.players.map(p => ({ ...p, role: null, word: null, isAlive: true, hasReadySeenCard: false, notes: [] }));
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomCode);
            await updateDoc(roomRef, {
                status: 'LOBBY',
                round: 1,
                wordPair: {civilian:'', undercover:'', hint:'', source:''},
                currentSpeakerId: null,
                speakingOrder: [],
                players: roomData.players,
                votes: {},
                pkPlayers: [],
                lastEliminated: null,
                winner: null,
                aiReferee: { message: '新的一局准备就绪！', timestamp: Date.now() }
            });
        };

        window.leaveRoom = function() {
            if (unsubscribeRoom) unsubscribeRoom();
            clearInterval(timerInterval); timerInterval = null; timerTurn = '';
            isPeekingCard = false;
            window.speechSynthesis?.cancel();
            currentRoomCode = '';
            roomData = null;
            render();
        };

                                        <span class="absolute top-2 left-2 px-1 rounded text-[10px] font-mono ${isSpk ? 'bg-amber-400 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300'}">${p.seat}号</span>
                                        ${roomData.status === 'LOBBY' && isHost && p.id !== currentUser?.uid ? `<button onclick="removePlayer('${p.id}')" class="absolute top-1.5 right-1.5 text-slate-500 hover:text-rose-400 text-xs">✕</button>` : ''}
                                        <div class="text-3xl my-1 relative">${p.avatar}</div>
                                        <div class="text-xs font-bold text-slate-200 truncate w-full">${escapeHtml(p.name)}</div>
                                        ${isMe ? `<span class="text-[10px] px-1 rounded bg-amber-400/20 text-amber-300 mt-0.5">当前视角</span>` : ''}
                                        ${(!p.isAlive || roomData.status === 'GAME_OVER') && p.role ? `<div class="mt-1 px-1.5 py-0.5 rounded text-[10px] font-bold ${p.role === 'CIVILIAN' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/30 text-rose-300'}">${p.role === 'CIVILIAN' ? '平民' : p.role === 'UNDERCOVER' ? '卧底' : '白板'} ${roomData.status === 'GAME_OVER' && p.role !== 'BLANK' ? `· ${escapeHtml(p.word)}` : ''}</div>` : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </section>

                    <!-- 阶段控制台 -->
                    ${roomData.status === 'LOBBY' ? `
                        <section class="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4">
                            <h2 class="text-sm font-bold text-white">聚会设置与词库</h2>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                <div>
                                    <label class="text-slate-400 block mb-1">词库主题</label>
                                    <div class="space-y-1.5">
                                        ${Object.entries(WORD_LIBRARY).map(([k, cat]) => `<button ${!isHost ? 'disabled' : ''} onclick="updateSetting('category', '${k}')" class="w-full px-3 py-2 rounded-xl border text-left flex justify-between ${roomData.settings.category === k ? 'bg-amber-500/20 border-amber-400 text-amber-200' : 'bg-slate-950 border-slate-800 text-slate-400'}"><span>${cat.name}</span></button>`).join('')}
                                    </div>
                                </div>
                                <div class="space-y-3">
                                    <div>
                                        <label class="text-slate-400 block mb-1">卧底人数</label>
                                        <div class="flex gap-2">
                                            ${[1, 2, 3].map(n => `<button ${!isHost ? 'disabled' : ''} onclick="updateSetting('undercoverCount', ${n})" class="flex-1 py-2 rounded-xl border font-bold ${roomData.settings.undercoverCount === n ? 'bg-rose-500/20 border-rose-400 text-rose-300' : 'bg-slate-950 border-slate-800 text-slate-400'}">${n}人</button>`).join('')}
                                        </div>
                                    </div>
                                    <div>
                                        <label class="text-slate-400 block mb-1">白板角色</label>
                                        <button ${!isHost ? 'disabled' : ''} onclick="updateSetting('hasBlank', ${!roomData.settings.hasBlank})" class="w-full py-2 px-3 rounded-xl border flex justify-between ${roomData.settings.hasBlank ? 'bg-violet-500/20 border-violet-400 text-violet-200' : 'bg-slate-950 border-slate-800 text-slate-400'}"><span>混入白板</span><span class="font-bold">${roomData.settings.hasBlank ? '开启' : '关闭'}</span></button>
                                    </div>
                                </div>
                            </div>
                            ${isHost ? `
                                <button onclick="startGame(false)" class="w-full py-4 rounded-2xl bg-gradient-to-r from-amber-400 to-rose-500 text-slate-950 font-black text-base shadow-xl">立即发牌开局 (${roomData.players.length}人)</button>
                            ` : `<div class="text-center py-3 text-sm text-amber-300 animate-pulse">等待房主发牌...</div>`}
                        </section>
                    ` : ''}

                    ${roomData.status === 'DEALING' && myPl ? `
                        <section class="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center space-y-4">
                            <span class="px-3 py-1 rounded-full bg-amber-500/15 text-amber-300 text-xs font-bold">防窥看牌阶段</span>
                            <h2 class="text-lg font-black text-white">${myPl.seat}号【${escapeHtml(myPl.name)}】的底牌</h2>
                            <div id="secret-card" role="button" tabindex="0" aria-label="按住查看底牌，松开隐藏" onpointerdown="event.preventDefault();setPeek(true)" onkeydown="if(event.code==='Space'||event.code==='Enter'){event.preventDefault();setPeek(true)}" onkeyup="setPeek(false)" onblur="setPeek(false)" oncontextmenu="return false" class="max-w-xs mx-auto h-44 rounded-3xl border-2 border-amber-400 bg-gradient-to-br from-amber-500/20 to-slate-900 flex flex-col items-center justify-center p-6 cursor-pointer shadow-2xl select-none">
                                <div id="secret-hidden" class="space-y-2"><div class="text-2xl">🔒</div><div class="text-sm font-bold text-slate-200">按住查看，松开隐藏</div></div>
                                <div id="secret-visible" hidden class="space-y-2"><div class="text-xs text-slate-400">你的秘密词语是：</div><div id="secret-word" class="text-3xl font-black tracking-widest text-amber-300"></div><div class="text-[10px] text-slate-500">松开立即隐藏</div></div>
                            </div>
                            <button onclick="confirmSeenCard()" ${myPl.hasReadySeenCard ? 'disabled' : ''} class="w-full max-w-sm mx-auto py-3.5 rounded-2xl bg-emerald-500 text-slate-950 font-black text-sm shadow-lg">${myPl.hasReadySeenCard ? '✓ 已准备，等待其他人...' : '我已记住词语，准备发言！'}</button>
                        </section>
                    ` : ''}

                    ${roomData.status === 'SPEAKING' && currentSpk ? `
                        <section class="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4">
                            <div class="flex justify-between items-center">
                                <span class="px-3 py-1 rounded-lg bg-amber-500/20 text-amber-300 text-xs font-bold">第 ${roomData.round} 轮 · 线下描述</span>
                                <div id="timer-badge" class="px-3 py-1 rounded-full font-mono text-sm font-black bg-slate-950 text-amber-300">${timeLeft}s</div>
                            </div>
                            <div class="p-5 rounded-2xl bg-slate-950 border border-amber-500/40 text-center space-y-2">
                                <div class="text-4xl">${currentSpk.avatar}</div>
                                <div class="text-lg font-black text-white">请 <span class="text-amber-300">${currentSpk.seat}号【${escapeHtml(currentSpk.name)}】</span> 线下开口描述</div>
                            </div>
                            ${myPl?.id === currentSpk.id || isHost ? `
                                <div class="space-y-2">
                                    <input type="text" id="speaker-keyword-input" placeholder="可选：记录TA说的关键词" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white">
                                    <button onclick="finishSpeaking()" class="w-full py-3 rounded-2xl bg-amber-400 text-slate-950 font-black text-sm">发言完毕，下一位 →</button>
                                </div>
                            ` : `<div class="text-center text-xs text-slate-400">请倾听 ${currentSpk.seat}号 发言...</div>`}
                        </section>
                    ` : ''}

                    ${roomData.status === 'VOTING' ? `
                        <section class="bg-slate-900 border border-rose-500/40 rounded-3xl p-5 space-y-3 text-center">
                            <h3 class="text-base font-black text-rose-300">🛡️ 轮流秘密投票</h3>
                            <p class="text-xs text-amber-300">已投 ${Object.keys(roomData.votes || {}).length} / ${aliveCount} 票 ${roomData.votes?.[myPl?.id] !== undefined ? '· 你已投票，请传给下一位' : ''}</p>
                            <p class="text-xs text-slate-400">${escapeHtml(myPl?.name)}，请点击上方你怀疑的玩家头像。投票立即锁定，再把设备交给下一位。</p>
                            ${myPl?.isAlive && roomData.votes?.[myPl.id] === undefined ? `<button onclick="castVote('ABSTAIN')" class="px-4 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-slate-300">本轮弃票</button>` : ''}
                        </section>
                    ` : ''}

                    ${roomData.status === 'RESULT' ? `
                        <section class="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center space-y-4">
                            <h3 class="text-xl font-black text-white">${escapeHtml(roomData.lastEliminated?.reason || '本轮结果公布')}</h3>
                            ${isHost ? `<button onclick="startNextRound()" class="w-full py-3.5 rounded-2xl bg-amber-400 text-slate-950 font-black text-sm">进入下一轮发言 →</button>` : `<div class="text-xs text-slate-400">等待房主开启下一轮...</div>`}
                        </section>
                    ` : ''}

                    ${roomData.status === 'GAME_OVER' ? `
                        <section class="bg-gradient-to-br from-slate-900 to-violet-950 border-2 border-amber-400 rounded-3xl p-6 text-center space-y-4 shadow-2xl">
                            <h2 class="text-2xl font-black text-white">${roomData.winner === 'CIVILIAN' ? '🎉 平民阵营获胜！' : '🕵️‍♂️ 卧底阵营获胜！'}</h2>
                            <div class="grid grid-cols-2 gap-3 max-w-md mx-auto text-xs">
                                <div class="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30">平民词：<strong class="text-white text-base block">${escapeHtml(roomData.wordPair?.civilian)}</strong></div>
                                <div class="p-3 rounded-xl bg-rose-500/10 border border-rose-500/30">卧底词：<strong class="text-white text-base block">${escapeHtml(roomData.wordPair?.undercover)}</strong></div>
                            </div>
                            ${isHost ? `<button onclick="backToLobby()" class="w-full py-3.5 rounded-2xl bg-amber-400 text-slate-950 font-black text-sm">返回重新开局</button>` : ''}
                        </section>
                    ` : ''}
                </main>
                ${rulesModalHtml}
            `;
        }

        window.setPeek = function(val) {
            isPeekingCard = !!val && roomData?.status === 'DEALING';
            const hidden = document.getElementById('secret-hidden');
            const visible = document.getElementById('secret-visible');
            const word = document.getElementById('secret-word');
            if (hidden) hidden.hidden = isPeekingCard;
            if (visible) visible.hidden = !isPeekingCard;
            if (word) word.textContent = isPeekingCard ? (roomData.players.find(p => p.id === activeControlId)?.word || '') : '';
        };
        window.addEventListener('pointerup', () => window.setPeek(false));
        window.addEventListener('pointercancel', () => window.setPeek(false));
        window.addEventListener('blur', () => window.setPeek(false));
        document.addEventListener('visibilitychange', () => { if (document.hidden) window.setPeek(false); });
        window.switchView = function(pid) { activeControlId = pid; isPeekingCard = false; render(); };
        window.toggleTTS = function() { ttsEnabled = !ttsEnabled; render(); };
        window.toggleRules = function(val) { showRulesModal = val; render(); };
        window.setAvatar = function(emo) { nickname = document.getElementById('nickname-input')?.value.trim() || nickname; selectedAvatar = emo; render(); };
        window.startNextRound = async function() {
            if (!roomData || roomData.hostId !== currentUser?.uid || roomData.status !== 'RESULT') return;
            await startSpeakingRound(roomData.players, (roomData.round || 1) + 1, []);
        };

        // 启动应用
        initApp();
    </script>
</body>
</html>
